<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- the sun, drawn by US in the loading-bar-end idiom (tiny pixel sun at
       each end of the game's loading bar). Deliberately NOT the wordmark's
       sun-cross, which is the game's own mark. -->
  <g fill="#F3C44B">
    <rect x="6" y="6" width="4" height="4"/>
    <rect x="7" y="2" width="2" height="2"/>
    <rect x="7" y="12" width="2" height="2"/>
    <rect x="2" y="7" width="2" height="2"/>
    <rect x="12" y="7" width="2" height="2"/>
    <rect x="3.6" y="3.6" width="1.8" height="1.8"/>
    <rect x="10.6" y="3.6" width="1.8" height="1.8"/>
    <rect x="3.6" y="10.6" width="1.8" height="1.8"/>
    <rect x="10.6" y="10.6" width="1.8" height="1.8"/>
  </g>
</svg>
